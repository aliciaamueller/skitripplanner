name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # core: the business-logic modules whose coverage must be >= 70%.
          - service: trip-management
            core: --cov=trip_management --cov=trip_statistics
          - service: room-allocation
            core: --cov=room_allocation
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.0.0 ruff==0.14.0
      - run: ruff check .
      # The tests run against a real SQL Server, never against Azure SQL.
      # This throwaway one lives only for this job, and its password is
      # random, made here and masked in the log, so none is stored anywhere.
      - name: Start SQL Server for the tests
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; then
              echo "TEST_DATABASE_URL=mssql://sa:$SA_PASSWORD@localhost:1433/master" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not start"; docker logs sqlserver; exit 1
      # Fails the job if the core logic is below 70% covered.
      - run: pytest ${{ matrix.core }} --cov-report=term-missing --cov-fail-under=70

  # The machine-readable description must match the schema and the spec.
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.33.0 openapi-spec-validator==0.7.1
      - run: check-jsonschema --schemafile system.schema.json system.yaml
      - run: openapi-spec-validator services/trip-management/openapi.yaml services/room-allocation/openapi.yaml

  images:
    needs: [test, describe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [trip-management, room-allocation]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the owner name may not be.
      - run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE=skitripplanner-${SERVICE,,}" >> "$GITHUB_ENV"
        env:
          SERVICE: ${{ matrix.service }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every push and pull request builds; only main publishes.
      # The tag is the commit SHA, never latest.
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
